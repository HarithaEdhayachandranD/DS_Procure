version: "1"

services:
  # ─── Frontend (React + Vite) ─────────────────────────────────────────────────
  - type: web
    name: procuresense-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: procuresense-backend
          type: web
          property: host
      - key: VITE_ML_URL
        fromService:
          name: procuresense-ml
          type: web
          property: host
      - key: VITE_APP_NAME
        value: ProcureSense AI
      - key: VITE_ENABLE_AI_FEATURES
        value: "true"

  # ─── Backend (Node.js + Express) ─────────────────────────────────────────────
  - type: web
    name: procuresense-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: DATABASE_URL
        fromDatabase:
          name: procuresense-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: ML_SERVICE_URL
        fromService:
          name: procuresense-ml
          type: web
          property: host
      - key: CORS_ORIGINS
        fromService:
          name: procuresense-frontend
          type: web
          property: host
      - key: LOG_LEVEL
        value: info

  # ─── ML Service (FastAPI) ─────────────────────────────────────────────────────
  - type: web
    name: procuresense-ml
    runtime: python
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: procuresense-db
          property: connectionString
      - key: API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        fromService:
          name: procuresense-backend
          type: web
          property: host

# ─── Database (PostgreSQL) ────────────────────────────────────────────────────
databases:
  - name: procuresense-db
    databaseName: procuresense
    user: procuresense_user
    plan: starter

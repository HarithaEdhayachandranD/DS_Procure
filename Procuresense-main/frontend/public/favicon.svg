  />

  <!-- Center node -->
  <circle cx="16" cy="14" r="3" fill="#ffffff"/>

  <!-- Spokes -->
  <line x1="16"   y1="11"   x2="16"   y2="6.5"  stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <line x1="16"   y1="17"   x2="16"   y2="21.5" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <line x1="13.4" y1="12.5" x2="9.5"  y2="10.2" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <line x1="18.6" y1="12.5" x2="22.5" y2="10.2" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <line x1="13.4" y1="15.5" x2="9.5"  y2="17.8" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <line x1="18.6" y1="15.5" x2="22.5" y2="17.8" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>

  <!-- AI badge -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" fill="none" role="img" aria-label="ProcureSense AI">

  <!-- ═══ Icon Mark ═══ -->
  <!-- Outer hexagon frame — procurement/supply chain -->
  <path
    d="M18 4 L30 4 L36 14.39 L30 24.78 L18 24.78 L12 14.39 Z"
    fill="#17bfb7"
  />
  <!-- Inner node — AI decision core -->
  <circle cx="24" cy="14.39" r="4.5" fill="#ffffff"/>
  <!-- Data flow lines — analytics/intelligence -->
  <line x1="24" y1="9.89"  x2="24" y2="4.5"   stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="24" y1="18.89" x2="24" y2="24.28"  stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="19.9" y1="11.89" x2="15.2" y2="9.2" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="28.1" y1="11.89" x2="32.8" y2="9.2" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="19.9" y1="16.89" x2="15.2" y2="19.6" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="28.1" y1="16.89" x2="32.8" y2="19.6" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- AI spark dot — top right accent -->
  <circle cx="33" cy="6"  r="2.5" fill="#047a74"/>
  <circle cx="33" cy="6"  r="1.2" fill="#17bfb7"/>

  <!-- ═══ Wordmark ═══ -->
  <!-- "Procure" -->
  <text
    x="46"
    y="19"
    font-family="Inter, system-ui, -apple-system, sans-serif"
    font-size="15"
    font-weight="700"
    letter-spacing="-0.3"
    fill="#0f172a"
  >Procure</text>
  <!-- "Sense" in teal -->
  <text
    x="108"
    y="19"
    font-family="Inter, system-ui, -apple-system, sans-serif"
    font-size="15"
    font-weight="700"
    letter-spacing="-0.3"
    fill="#17bfb7"
  >Sense</text>
  <!-- "AI" badge -->
  <rect x="152" y="7" width="22" height="14" rx="4" fill="#047a74"/>
  <text
    x="163"
    y="17.5"
    font-family="Inter, system-ui, -apple-system, sans-serif"
    font-size="9"
    font-weight="700"
    letter-spacing="0.5"
    fill="#ffffff"
    text-anchor="middle"
  >AI</text>

  <!-- Tagline -->
  <text
    x="46"
    y="32"
    font-family="Inter, system-ui, -apple-system, sans-serif"
    font-size="7"
    font-weight="500"
    letter-spacing="1.2"
    fill="#94a3b8"
  >PROCUREMENT INTELLIGENCE</text>

</svg>
